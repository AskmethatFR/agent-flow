name: Slice
description: A vertical slice of a phase epic, with testable acceptance criteria.
labels: ["type:slice"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Who needs this and why. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered and testable.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: gherkin
    attributes:
      label: Gherkin
      description: Path(s) to the .feature file(s) under features/.
  - type: textarea
    id: scope
    attributes:
      label: Expected scope paths
      description: Files or directories this slice is expected to touch (feeds scope.json).
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Issues that must be done first.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
